# Metas de inflação (IPCA) definidas pelo Conselho Monetário Nacional (CMN).
# meta e tolerancia em pontos percentuais; o intervalo vai de meta - tolerancia a meta + tolerancia.
# Desde 2025 a meta é "contínua": 3% medidos no acumulado em 12 meses de qualquer mês, não só em dezembro.
# 2003: meta ajustada pelo BC na época (a meta original do CMN era 3,25%).
metas:
